name: Debug Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/debug.yml"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.4
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260611195102-4dd8f1dbf5d2
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core debug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Build Hev
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          HEV_DIR="library/hev-tunnel/hev-socks5-tunnel"
          JNI_DIR="app/src/main/jniLibs"
          echo "NDK: $ANDROID_NDK_HOME"
          echo "Building hev-socks5-tunnel..."
          sed -i 's/LOCAL_CFLAGS += -DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -DENABLE_LIBRARY/LOCAL_CFLAGS += -DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -DENABLE_LIBRARY -DPKGNAME=io\/nekohasekai\/sagernet\/bg -DCLSNAME=HevTunnel/' $HEV_DIR/Android.mk
          cd $HEV_DIR
          $ANDROID_NDK_HOME/ndk-build -j$(nproc) NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk
          echo "Copy .so files to jniLibs..."
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f libs/$abi/libhev-socks5-tunnel.so ]; then
            mkdir -p ../../../$JNI_DIR/$abi
            cp libs/$abi/libhev-socks5-tunnel.so ../../../$JNI_DIR/$abi/
              echo "OK: $abi/libhev-socks5-tunnel.so"
            else
              echo "WARN: $abi/libhev-socks5-tunnel.so not found"
            fi
          done
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-debug-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssDebug
          APK="app/build/outputs/apk/oss/debug"
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Sign APK
        run: |
          APK_DIR="app/build/outputs/apk/oss/debug"
          keytool -genkey -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -storepass android -keypass android -dname "CN=Android Debug" 2>/dev/null
          for f in $APK_DIR/*-unsigned.apk; do
            out="${f%-unsigned.apk}-debug.apk"
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --out "$out" "$f"
            echo "Signed: $out"
          done
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: ${{ env.APK }}
